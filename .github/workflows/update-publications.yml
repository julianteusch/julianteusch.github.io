name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update publication data
        run: node scripts/update-publications.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data/publications.json publications preprints sitemap.xml robots.txt)" ]; then
            echo "No publication updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json publications preprints sitemap.xml robots.txt
          git commit -m "Update publications"
          git push
